    <text x="248" y="145" text-anchor="middle" font-size="17" font-weight="700">REST API</text>
    <text x="248" y="170" text-anchor="middle" font-size="13" fill="#7a8ba6" font-family="Consolas, monospace">Flask · Swagger</text>

    <rect x="352" y="110" width="116" height="84" rx="6" fill="#0d0d1a" stroke="#00e5ff"/>
    <text x="410" y="145" text-anchor="middle" font-size="17" font-weight="700">Models</text>
    <text x="410" y="170" text-anchor="middle" font-size="13" fill="#7a8ba6" font-family="Consolas, monospace">OOP · SQLAlchemy</text>

