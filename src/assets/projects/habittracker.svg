    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00e5ff"/></marker>
  </defs>
  <rect width="640" height="360" fill="#05050c"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <g font-family="Segoe UI, system-ui, sans-serif" fill="#fff">
