<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Sentinnel Banking pipeline: request, policy engine, ML risk score, RAG policy check, LLM explanation">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff7a45" stroke-opacity=".09"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff7a45"/></marker>
  </defs>
  <rect width="640" height="360" fill="#0d0d0f"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <g font-family="Segoe UI, system-ui, sans-serif" fill="#fff">
    <rect x="20" y="150" width="100" height="84" rx="6" fill="#16161a" stroke="#ff7a45"/>
    <text x="70" y="185" text-anchor="middle" font-size="16" font-weight="700">Request</text>
    <text x="70" y="210" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="Consolas, monospace">3 agents</text>

    <rect x="144" y="150" width="100" height="84" rx="6" fill="#0a0a0b" stroke="#6fd3a5" stroke-width="2"/>
    <text x="194" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#6fd3a5">Policy</text>
    <text x="194" y="210" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="Consolas, monospace">decides</text>

    <rect x="268" y="150" width="100" height="84" rx="6" fill="#16161a" stroke="#ff7a45"/>
    <text x="318" y="185" text-anchor="middle" font-size="16" font-weight="700">ML risk</text>
    <text x="318" y="210" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="Consolas, monospace">rand. forest</text>

    <rect x="392" y="150" width="100" height="84" rx="6" fill="#16161a" stroke="#e8b86f" stroke-width="2"/>
    <text x="442" y="185" text-anchor="middle" font-size="16" font-weight="700">RAG check</text>
    <text x="442" y="210" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="Consolas, monospace">6 policies</text>

    <rect x="516" y="150" width="104" height="84" rx="6" fill="#16161a" stroke="#ff7a45"/>
    <text x="568" y="185" text-anchor="middle" font-size="16" font-weight="700">LLM</text>
    <text x="568" y="210" text-anchor="middle" font-size="12" fill="#a8a29e" font-family="Consolas, monospace">explains</text>
  </g>
  <g stroke="#ff7a45" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M120 192 L140 192"/><path d="M244 192 L264 192"/><path d="M368 192 L388 192"/><path d="M492 192 L512 192"/>
  </g>
  <path d="M442 238 L442 296" stroke="#e8b86f" stroke-dasharray="3 4"/>
  <text x="434" y="322" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-style="italic" fill="#e8b86f">my part: the RAG layer</text>
